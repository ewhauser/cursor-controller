version: "2"

formatters:
  enable:
    - goimports

linters:
  enable:
    - bodyclose
    - containedctx
    - contextcheck
    - errcheck
    - errorlint
    - gocritic
    - govet
    - ineffassign
    - misspell
    - modernize
    - nilerr
    - noctx
    - revive
    - staticcheck
    - testifylint
    - unconvert
    - unparam
    - unused
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - commentedOutCode
        - hugeParam
        - initClause
        - rangeValCopy
        - todoCommentWithoutDetail
        - typeDefFirst
        - unnamedResult
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          disabled: true

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
