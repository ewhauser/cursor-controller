{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cursor-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cursor-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  {{- if .Values.persistence.enabled }}
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cursor-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cursor-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cursor-controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cursor-controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
