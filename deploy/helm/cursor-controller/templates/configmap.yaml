{{- $_ := include "cursor-controller.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cursor-controller.templatesConfigMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cursor-controller.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
data:
  pod-template.yaml: |
    {{- include "cursor-controller.workerPod" . | nindent 4 }}
  {{- if .Values.persistence.enabled }}
  pvc-template.yaml: |
    apiVersion: v1
    kind: PersistentVolumeClaim
    spec:
      {{- toYaml .Values.persistence.claimSpec | nindent 6 }}
  {{- end }}
