apiVersion: v1
kind: Secret
metadata:
  name: cursor-api-key
  namespace: cursord
type: Opaque
stringData:
  api-key: e2e-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-cursor-api
  namespace: cursord
  labels: {app: fake-cursor-api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: fake-cursor-api}
  template:
    metadata:
      labels: {app: fake-cursor-api}
    spec:
      containers:
        - name: api
          image: cursor-controller-e2e:dev
          imagePullPolicy: IfNotPresent
          command: ["/fake-cursor-api"]
          args: ["--addr=:8080", "--api-key=e2e-key", "--heartbeat=5s"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: fake-cursor-api
  namespace: cursord
spec:
  type: NodePort
  selector: {app: fake-cursor-api}
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
